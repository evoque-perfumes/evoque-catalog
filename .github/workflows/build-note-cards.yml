# يبني بطاقات المكونات تلقائيًا (assets/cards/<id>.webp) كل ما تغيّر data.json —
# يعني لما تضيف عطر جديد أو تعدّل نوتاته من لوحة التحكم، بطاقته تطلع بالموقع خلال دقايق.
# السكربت يتجاوز البطاقات اللي بياناتها ما تغيّرت (assets/cards/.manifest.json).
name: Build note cards
on:
  push:
    branches: [main]
    paths: ["data.json"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: note-cards
  cancel-in-progress: false
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build and commit cards (retries on top of the latest main)
        run: |
          git config user.name "evoque-cards-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/build-note-cards.js
            git add assets/cards
            if git diff --cached --quiet; then echo "No card changes."; exit 0; fi
            git commit -q -m "Note cards: auto-build for new/changed perfumes"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "Push raced with another save — rebuilding on the latest main (try $i)"; sleep 8
          done
          exit 1
