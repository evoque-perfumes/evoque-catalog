# يبني بطاقات المكونات تلقائيًا (assets/cards/<id>.webp) كل ما تغيّر data.json —
# يعني لما تضيف عطر جديد أو تعدّل نوتاته من لوحة التحكم، بطاقته تطلع بالموقع خلال دقايق.
# السكربت يتجاوز البطاقات اللي بياناتها ما تغيّرت (assets/cards/.manifest.json).
name: Build note cards
on:
  push:
    branches: [main]
    paths: ["data.json"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: note-cards
  cancel-in-progress: false
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build cards (new or changed perfumes only)
        run: node scripts/build-note-cards.js
      - name: Commit cards
        run: |
          git config user.name "evoque-cards-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          if git diff --cached --quiet; then echo "No card changes."; exit 0; fi
          git commit -m "Note cards: auto-build for new/changed perfumes"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 6
          done
          exit 1
