# ملاحظة (22 أغسطس 2026): هذا الـ workflow كان يشتغل تلقائيًا كل 20 دقيقة
# ويبني data.json من Google Sheet. تم إيقاف الجدولة التلقائية لأن إدارة
# المنتجات صارت من لوحة التحكم (admin-upload.html) وتكتب على data.json
# مباشرة — لو خليناه شغال بيرجع يكتب فوق أي تعديل يصير من اللوحة بأول
# دورة تشغيل تالية (كل 20 دقيقة) ويمسحه. خليناه موجود بس بتشغيل يدوي
# (workflow_dispatch) لو احتجنا نرجع نبني data.json من الشيت كخطة طوارئ.
name: Update catalog data.json

on:
  workflow_dispatch: {}       # يسمح بتشغيله يدويًا من تبويب Actions فقط — الجدولة التلقائية متوقفة

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data.json from Google Sheet
        run: node scripts/build-catalog-json.js

      - name: Commit data.json if changed
        run: |
          git add data.json
          if git diff --cached --quiet; then
            echo "لا تغييرات — تخطي الـ commit."
          else
            git config user.name "evoque-catalog-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: auto-update data.json [skip ci]"
            git push
          fi
