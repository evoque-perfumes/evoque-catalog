<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evoque Perfume — الكتالوج الجاهز</title>
<style>
  :root{
    --bg:#0f0d10; --card:#1a171b; --card2:#211d22; --gold:#c9a24b; --gold-soft:#e8d8ad;
    --text:#f3efe9; --muted:#a89f95; --line:#2c272b; --wa:#25d366;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px; /* space for floating cart bar */
  }
  header{
    text-align:center; padding:20px 16px 20px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#171417,#0f0d10); position:relative;
  }
  .lang-switch{
    position:absolute; top:14px; inset-inline-end:14px;
    display:flex; background:var(--card2); border:1px solid var(--line);
    border-radius:20px; overflow:hidden; font-size:12px;
  }
  .lang-switch button{
    border:none; background:transparent; color:var(--muted); padding:6px 12px;
    cursor:pointer; font-size:12px;
  }
  .lang-switch button.active{ background:var(--gold); color:#20190a; font-weight:700; }
  header h1{ margin:8px 0 0; font-size:26px; letter-spacing:1px; color:var(--gold-soft); font-weight:700; }
  header p{ margin:8px 0 0; color:var(--muted); font-size:14px; }
  .logo-img{ display:block; margin:6px auto 0; max-width:220px; width:60%; height:auto; }
  .results-count{ max-width:900px; margin:14px auto 0; text-align:center; color:var(--muted); font-size:13px; }
  .show-more-wrap{ display:flex; justify-content:center; margin:18px 0 8px; }
  .show-more-btn{
    background:var(--card2); color:var(--gold-soft); border:1px solid var(--gold);
    padding:10px 22px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .show-more-btn:hover{ background:var(--gold); color:#20190a; }
  .notfound-banner{
    max-width:900px; margin:14px auto 0; background:var(--card2); border:1px dashed var(--gold);
    border-radius:10px; padding:10px 16px; font-size:13px; color:var(--gold-soft);
    text-align:center;
  }
  .notfound-banner a{ color:var(--wa); font-weight:700; text-decoration:none; }
  .search-controls{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    max-width:900px; margin:16px auto 0; padding:0 16px;
  }
  .search-input, .brand-select{
    background:var(--card2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:9px 14px; font-size:13px; flex:1; min-width:160px;
  }
  .search-input:focus, .brand-select:focus{ outline:none; border-color:var(--gold); }
  .badge.gender-badge{ color:var(--gold-soft); border-color:var(--gold); }
  .filters{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    padding:16px; max-width:900px; margin:0 auto;
  }
  .filter-btn{
    background:var(--card2); color:var(--text); border:1px solid var(--line);
    padding:8px 16px; border-radius:20px; font-size:13px; cursor:pointer;
    transition:all .15s;
  }
  .filter-btn:hover{ border-color:var(--gold); }
  .filter-btn.active{ background:var(--gold); color:#20190a; border-color:var(--gold); font-weight:600; }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:16px; padding:8px 16px 48px; max-width:1100px; margin:0 auto;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .card .imgwrap{
    width:100%; aspect-ratio:1/1; background:var(--card2);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .card .imgwrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card .imgwrap .placeholder{ color:var(--muted); font-size:12px; text-align:center; padding:8px; }
  .card .info{ padding:12px 14px 14px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .card .brand{ font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:.5px; }
  .card .name{ font-size:15px; font-weight:600; color:var(--text); }
  .card .badge-row{ display:flex; gap:6px; flex-wrap:wrap; margin:2px 0; }
  .badge{
    font-size:10px; background:var(--card2); color:var(--muted);
    padding:3px 8px; border-radius:10px; border:1px solid var(--line);
  }
  .notes-toggle{
    font-size:12px; color:var(--gold); background:none; border:none; cursor:pointer;
    text-align:start; padding:0; margin-top:2px;
  }
  .notes-box{
    display:none; font-size:12px; color:var(--muted); line-height:1.6;
    background:var(--card2); border-radius:8px; padding:8px 10px; margin-top:4px;
  }
  .notes-box.open{ display:block; }
  .notes-box div{ margin-bottom:4px; }
  .notes-box b{ color:var(--gold-soft); }
  .price-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:var(--gold-soft); margin-top:auto; padding-top:8px;
    border-top:1px dashed var(--line);
  }
  .size-select{
    background:var(--card2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:5px 8px; font-size:12px;
  }
  .add-btn{
    width:100%; margin-top:8px; padding:9px; border:none; border-radius:8px;
    background:var(--gold); color:#20190a; font-weight:700; font-size:13px; cursor:pointer;
  }
  .add-btn.added{ background:var(--wa); color:#0b1a10; }
  .add-btn:disabled{ background:var(--card2); color:var(--muted); cursor:not-allowed; }
  footer{ text-align:center; color:var(--muted); font-size:12px; padding:20px; border-top:1px solid var(--line); }
  .empty{ text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }

  /* Floating cart bar */
  .cart-bar{
    position:fixed; bottom:0; left:0; right:0; background:#171417;
    border-top:1px solid var(--line); padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; z-index:50; box-shadow:0 -4px 16px rgba(0,0,0,.4);
  }
  .cart-bar .cart-info{ font-size:13px; color:var(--gold-soft); }
  .cart-bar .cart-info b{ color:var(--text); }
  .checkout-btn{
    background:var(--wa); color:#0b1a10; border:none; padding:11px 20px;
    border-radius:8px; font-weight:700; font-size:14px; cursor:pointer;
    text-decoration:none; white-space:nowrap;
  }
  .checkout-btn:disabled{ opacity:.4; cursor:not-allowed; }
</style>
</head>

  "amberwood":"خشب العنبر","saffron":"زعفران","ambergris":"عنبر بحري","fir":"صنوبر","cedar":"أرز",

function translateForDisplay(text){
  if(lang !== "ar" || !text) return text || "";
  // نترجم كل جزء مفصول بفاصلة على حدة، مع إبقاء أي مصطلح غير معروف بالإنجليزي كما هو
  return text.split(",").map(part=>{
    const trimmed = part.trim();
    const key = trimmed.toLowerCase();
    if(TERM_AR[key]) return TERM_AR[key];
    // حاول استبدال "hours"/"hour" داخل نص مثل "8 hours"
    let replaced = trimmed.replace(/\bhours\b/i, TERM_AR["hours"]).replace(/\bhour\b/i, TERM_AR["hour"]);
    return replaced;
  }).join(lang==="ar" ? "، " : ", ");
}

// محول رابط Google Drive بأي صيغة إلى رابط صورة مباشر قابل للعرض
// نستخدم صيغة thumbnail (مو uc?export=view) لأنها أكثر ثباتًا لعرض الصور المضمّنة
// في صفحات خارجية — Google أحيانًا يحجب صيغة uc?export=view لصور تُعرض بكثرة (hotlinking).
function driveDirectImageUrl(link){
  if(!link) return "";
  const m = link.match(/[-\w]{25,}/); // يلتقط أي Drive file ID داخل أي صيغة رابط
  return m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=w1000` : link;
}

// محلّل CSV بسيط يدعم الحقول المحاطة بعلامات اقتباس (فيها فواصل)
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && next === '\n') i++;
        row.push(field); field = "";
        if(row.some(v=>v!=="")) rows.push(row);
        row = [];
      } else { field += c; }
    }
  }
  if(field!=="" || row.length){ row.push(field); rows.push(row); }
  return rows;
}

// ملاحظة مهمة: لو العمود فاضي بالشيت (ما تم تعبئته بعد)، ما نحط له وسم افتراضي
// "الكل" — نخليه بدون وسوم إطلاقًا، عشان ما يظهر خطأ تحت كل فلتر موسمي قبل لا
// تعبي البيانات الفعلية. هو بس يظهر تحت فلتر "الكل" (اللي دايمًا يرجع true).
function seasonsFromText(text){
  const t = (text||"").toLowerCase();
  const out = [];
  if(t.includes("all")) out.push("all");
  if(t.includes("summer")) out.push("summer");
  if(t.includes("winter")) out.push("winter");
  if(t.includes("spring")) out.push("spring");
  if(t.includes("autumn") || t.includes("fall")) out.push("autumn");
  return out; // فاضي لو ما فيه بيانات — يظهر بس تحت "الكل"
}

function daynightFromText(text){
  const t = (text||"").toLowerCase();
  const out = [];
  if(t.includes("day")) out.push("day");
  if(t.includes("night")) out.push("night");
  return out; // فاضي لو ما فيه بيانات — يظهر بس تحت "الكل"
}

// يطبّع قيمة عمود Gender لأي صيغة (Men/Male/رجالي...) إلى واحدة من: men / women / unisex
function genderKeyFromText(text){
  const t = (text||"").toLowerCase().trim();
  if(!t) return "";
  if(t.includes("unisex") || t.includes("both")) return "unisex";
  if(t.includes("women") || t.includes("woman") || t.includes("female") || t === "her") return "women";
  if(t.includes("men") || t.includes("man") || t.includes("male") || t === "him") return "men";
  return "";
}

// حالة تحميل البيانات — جزء من نظام الترجمة عشان لو تبدّل اللغة أثناء
// التحميل أو بعد خطأ اتصال، الرسالة تترجم فورًا مثل باقي الصفحة تمامًا
// (قبل كذا كانت رسالة الخطأ تُكتب مباشرة بالعربي وتضل عالقة حتى لو بدّلت اللغة)
let loadState = "loading"; // "loading" | "error" | "loaded"
let loadErrorMsg = "";

async function loadPerfumesFromSheet(){
  try{
    const res = await fetch(CSV_URL);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if(rows.length < 2) throw new Error("empty sheet");

    const headers = rows[0].map(h => h.trim());
    const idx = name => headers.indexOf(name);

    perfumes = rows.slice(1).filter(r => r[idx("Brand")] && r[idx("Name")]).map((r, i) => ({
      id: "row-" + i,
      brand: r[idx("Brand")] || "",
      name: r[idx("Name")] || "",
      image: driveDirectImageUrl(r[idx("Image Link (Google Drive)")]),
      seasons: seasonsFromText(r[idx("Seasons")]),
      daynight: daynightFromText(r[idx("Day/Night")]),
      gender: genderKeyFromText(r[idx("Gender")]),
      price50: parseFloat(r[idx("50ML Price UAE (AED)")]) || null,
      price10: parseFloat(r[idx("10ML Price UAE (AED)")]) || null,
      // عمودي المخزون اختياريان — لو مو موجودين بالشيت بعد (ما أضفتهم يدويًا)، نعتبر كل شي متوفر بشكل افتراضي
      stock50: idx("50ML In Stock") === -1 ? true : (r[idx("50ML In Stock")] || "").trim().toLowerCase() !== "no",
      stock10: idx("10ML In Stock") === -1 ? true : (r[idx("10ML In Stock")] || "").trim().toLowerCase() !== "no",
      accords: r[idx("Main Accords")] || "",
      notesTop: r[idx("Notes")] || "",
      notesMid: "", notesBase: "",
      longevity: r[idx("Longevity")] || "", sillage: r[idx("Sillage")] || ""
    }));

    // ترتيب العطور حسب اسم البراند أولًا، وبعده اسم العطر (أبجديًا)
    perfumes.sort((a, b) => {
      const brandCompare = a.brand.localeCompare(b.brand, "en", {sensitivity: "base"});
      if(brandCompare !== 0) return brandCompare;
      return a.name.localeCompare(b.name, "en", {sensitivity: "base"});
    });

    loadState = "loaded";
  } catch(err){
    loadState = "error";
    loadErrorMsg = err.message;
  }
  renderAll();
}

let activeFilter = "all";
let selectedBrand = "all";
let searchQuery = "";
const PAGE_SIZE = 12; // كم عطر يظهر بالصفحة الرئيسية قبل ما نحتاج "عرض المزيد"
let visibleCount = PAGE_SIZE;
// cart is an in-memory object only (no browser storage): { perfumeId: {size, qty} }
let cart = {};

function setLang(newLang){
  lang = newLang;
  document.documentElement.lang = lang;
  document.documentElement.dir = I18N[lang].dir;
  document.getElementById("btnAr").classList.toggle("active", lang==="ar");
  document.getElementById("btnEn").classList.toggle("active", lang==="en");
  renderAll();
}

function renderAll(){
  const t = I18N[lang];
  document.getElementById("headerSub").textContent = t.sub;
  document.getElementById("footerText").textContent = t.footer;
  document.getElementById("checkoutBtn").textContent = t.checkout;

  const banner = document.getElementById("notfoundBanner");
  banner.innerHTML = t.notfound;
  const waMsg = lang === "ar" ? "أبي أسأل عن عطر مو موجود في الصفحة، اسمه: " : "I'd like to ask about a perfume not on the page, it's called: ";
  document.getElementById("notfoundLink").href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(waMsg)}`;
  document.getElementById("notfoundLink").target = "_blank";

  renderSearchControls();
  renderFilters();
  renderGrid();
  renderCart();
}

// خانة البحث (بالاسم أو البراند) + قائمة منسدلة للبراندات — تُبنى من البراندات الموجودة فعليًا بالبيانات
function renderSearchControls(){
  const t = I18N[lang];
  const searchInput = document.getElementById("searchInput");
  searchInput.placeholder = t.searchPlaceholder;
  searchInput.value = searchQuery;
  searchInput.oninput = (e)=>{ searchQuery = e.target.value; visibleCount = PAGE_SIZE; renderGrid(); };

  const brandSelect = document.getElementById("brandSelect");
  const brands = Array.from(new Set(perfumes.map(p => p.brand).filter(Boolean)))
    .sort((a, b) => a.localeCompare(b, "en", {sensitivity: "base"}));

  const prevSelection = selectedBrand;
  brandSelect.innerHTML = `<option value="all">${t.allBrands}</option>` +
    brands.map(b => `<option value="${b.replace(/"/g,"&quot;")}">${b}</option>`).join("");
  // لو البراند المختار سابقًا ما عاد موجود (مثلاً بعد تحديث البيانات)، رجّعه لـ "الكل"
  selectedBrand = brands.includes(prevSelection) ? prevSelection : "all";
  brandSelect.value = selectedBrand;
  brandSelect.onchange = (e)=>{ selectedBrand = e.target.value; visibleCount = PAGE_SIZE; renderGrid(); };
}

function renderFilters(){
  const t = I18N[lang];
  const wrap = document.getElementById("filters");
  wrap.innerHTML = "";
  t.filters.forEach(f=>{
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (f.key===activeFilter ? " active" : "");
    btn.textContent = f.label;
    btn.onclick = ()=>{ activeFilter = f.key; visibleCount = PAGE_SIZE; renderFilters(); renderGrid(); };
    wrap.appendChild(btn);
  });
}

function matches(p){
  // فلتر البراند وخانة البحث يشتغلون دايمًا (مستقلين عن أزرار الفلاتر فوق)
  if(selectedBrand !== "all" && p.brand !== selectedBrand) return false;
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    if(!(p.brand.toLowerCase().includes(q) || p.name.toLowerCase().includes(q))) return false;
  }
  if(activeFilter==="all") return true;
  if(activeFilter==="night" || activeFilter==="day") return p.daynight.includes(activeFilter);
  if(activeFilter==="men" || activeFilter==="women" || activeFilter==="unisex") return p.gender === activeFilter;
  return p.seasons.includes(activeFilter) || p.seasons.includes("all");
}

function priceLabel(p){
  const t = I18N[lang];
  const parts = [];
  if(p.price50) parts.push(`50ml: ${p.price50} AED${p.stock50 ? "" : " (" + t.outOfStock + ")"}`);
  if(p.price10) parts.push(`10ml: ${p.price10} AED${p.stock10 ? "" : " (" + t.outOfStock + ")"}`);
  return parts.length ? parts.join(" · ") : t.askPrice;
}

function renderGrid(){
  const t = I18N[lang];
  const grid = document.getElementById("grid");
  const resultsCountEl = document.getElementById("resultsCount");
  const showMoreWrap = document.getElementById("showMoreWrap");
  grid.innerHTML = "";
  resultsCountEl.textContent = "";
  showMoreWrap.innerHTML = "";

  if(loadState === "loading"){
    grid.innerHTML = `<div class="empty">${t.loading}</div>`;
    return;
  }
  if(loadState === "error"){
    grid.innerHTML = `<div class="empty">${t.errorPrefix} (${loadErrorMsg}).<br>${t.errorHint}</div>`;
    return;
  }

  const fullList = perfumes.filter(matches);
  if(fullList.length===0){
    grid.innerHTML = `<div class="empty">${t.noMatch}</div>`;
    return;
  }

  // نعرض عدد محدود من العطور أول شي (بدل كل العطور دفعة وحدة) عشان الصفحة الرئيسية تكون أخف وأنظف
  const list = fullList.slice(0, visibleCount);
  resultsCountEl.textContent = t.resultsCount(list.length, fullList.length);

  if(fullList.length > visibleCount){
    const moreBtn = document.createElement("button");
    moreBtn.className = "show-more-btn";
    moreBtn.type = "button";
    moreBtn.textContent = t.showMore;
    moreBtn.onclick = ()=>{ visibleCount += PAGE_SIZE; renderGrid(); };
    showMoreWrap.appendChild(moreBtn);
  }

  list.forEach(p=>{
    const card = document.createElement("div");
    card.className = "card";

    const imgWrap = document.createElement("div");
    imgWrap.className = "imgwrap";
    if(p.image){
      const img = document.createElement("img");
      img.src = p.image;
      img.alt = p.brand + " " + p.name;
      imgWrap.appendChild(img);
    } else {
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = t.imgPending;
      imgWrap.appendChild(ph);
    }

    const info = document.createElement("div");
    info.className = "info";

    // نبني خيارات الحجم — لو حجم معين نفذ من الكمية، نخليه يظهر بس معطّل (مو نخفيه) عشان العميل يعرف إنه موجود بالأصل وبيرجع
    const sizeOptions = [];
    let firstAvailableSize = null;
    if(p.price50){
      sizeOptions.push(`<option value="50" ${p.stock50 ? "" : "disabled"}>50ml — ${p.price50} AED${p.stock50 ? "" : " (" + t.outOfStock + ")"}</option>`);
      if(p.stock50 && firstAvailableSize===null) firstAvailableSize = "50";
    }
    if(p.price10){
      sizeOptions.push(`<option value="10" ${p.stock10 ? "" : "disabled"}>10ml — ${p.price10} AED${p.stock10 ? "" : " (" + t.outOfStock + ")"}</option>`);
      if(p.stock10 && firstAvailableSize===null) firstAvailableSize = "10";
    }
    const hasAvailableSize = firstAvailableSize !== null;

    const accordsDisplay = translateForDisplay(p.accords);
    const notesTopDisplay = translateForDisplay(p.notesTop);
    const longevityDisplay = translateForDisplay(p.longevity);
    const sillageDisplay = translateForDisplay(p.sillage);
    const genderLabel = p.gender === "men" ? t.genderMen : p.gender === "women" ? t.genderWomen : p.gender === "unisex" ? t.genderUnisex : "";

    info.innerHTML = `
      <div class="brand">${p.brand}</div>
      <div class="name">${p.name}</div>
      <div class="badge-row">
        ${genderLabel ? `<span class="badge gender-badge">${genderLabel}</span>` : ""}
        ${accordsDisplay ? `<span class="badge">${accordsDisplay}</span>` : ""}
      </div>
      <button class="notes-toggle" type="button">${t.notesToggleOpen}</button>
      <div class="notes-box">
        ${notesTopDisplay ? `<div><b>${t.top}:</b> ${notesTopDisplay}</div>` : ""}
        ${longevityDisplay || sillageDisplay ? `<div><b>${t.longevity}:</b> ${longevityDisplay} &nbsp; <b>${t.sillage}:</b> ${sillageDisplay}</div>` : ""}
      </div>
      <div class="price-row">
        <span>${priceLabel(p)}</span>
        ${sizeOptions.length ? `<select class="size-select">${sizeOptions.join("")}</select>` : ""}
      </div>
    `;

    const notesToggle = info.querySelector(".notes-toggle");
    const notesBox = info.querySelector(".notes-box");
    notesToggle.onclick = ()=>{
      notesBox.classList.toggle("open");
      notesToggle.textContent = notesBox.classList.contains("open") ? t.notesToggleClose : t.notesToggleOpen;
    };

    // اختار الحجم المتوفر أول شي كافتراضي بالـ select (لو موجود)
    const sizeSelectEl = info.querySelector(".size-select");
    if(sizeSelectEl && firstAvailableSize) sizeSelectEl.value = firstAvailableSize;

    const addBtn = document.createElement("button");
    addBtn.className = "add-btn";
    if(!hasAvailableSize && !cart[p.id]){
      // كل الأحجام اللي فيها سعر نفذت من الكمية — نعطّل الزر بدل ما نخلي العميل يضيف شي مو متوفر
      addBtn.textContent = t.allOutOfStock;
      addBtn.disabled = true;
    } else {
      addBtn.textContent = cart[p.id] ? t.added : t.add;
      if(cart[p.id]) addBtn.classList.add("added");
      addBtn.onclick = ()=>{
        if(cart[p.id]){
          delete cart[p.id];
        } else {
          const sizeSelect = info.querySelector(".size-select");
          const size = sizeSelect ? sizeSelect.value : (firstAvailableSize || "50");
          const price = size === "50" ? p.price50 : p.price10;
          cart[p.id] = { brand: p.brand, name: p.name, size, price };
        }
        renderGrid();
        renderCart();
      };
    }

    card.appendChild(imgWrap);
    card.appendChild(info);
    card.appendChild(addBtn);
    grid.appendChild(card);
  });
}

function renderCart(){
  const t = I18N[lang];
  const items = Object.values(cart);
  const cartInfo = document.getElementById("cartInfo");
  const checkoutBtn = document.getElementById("checkoutBtn");

  if(items.length === 0){
    cartInfo.textContent = t.cartEmpty;
    checkoutBtn.disabled = true;
    checkoutBtn.onclick = null;
    return;
  }

  const total = items.reduce((sum,i)=> sum + (i.price||0), 0);
  cartInfo.innerHTML = `<b>${items.length}</b> ${t.cartItemsLabel} · ${t.approxTotal} <b>${total} AED</b> ${t.withoutDelivery}`;
  checkoutBtn.disabled = false;
  checkoutBtn.onclick = ()=>{
    let msg = t.orderMsgIntro;
    items.forEach((i,idx)=>{
      msg += `${idx+1}. ${i.brand} - ${i.name} (${i.size}ml) — ${i.price ? i.price + " AED" : t.orderMsgAskPrice}\n`;
    });
    msg += `\n${t.orderMsgTotal}: ${total} AED ${t.withoutDelivery}`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
  };
}

document.getElementById("btnAr").onclick = ()=> setLang("ar");
document.getElementById("btnEn").onclick = ()=> setLang("en");

setLang("ar");
loadPerfumesFromSheet();
</script>
