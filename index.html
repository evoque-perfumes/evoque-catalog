<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evoque Perfume | عطور فاخرة بديلة للأصلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f4ec; --bg-soft:#f1ead9; --surface:#ffffff;
    --ink:#221c15; --muted:#8a7d68; --muted-soft:#b7a98e;
    --gold:#b3873f; --gold-deep:#8a6528; --gold-soft:#e9d7ae; --gold-pale:#f4e9cf;
    --dark:#171310; --dark2:#211a14;
    --line:#e6dcc6; --wa:#25d366; --wa-deep:#1ea952;
    --shadow:0 10px 30px rgba(34,28,21,.08);
    --shadow-lg:0 20px 50px rgba(34,28,21,.16);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Poppins', 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:88px;
  }
  h1,h2,h3,.serif{ font-family:'Cormorant Garamond', 'Poppins', serif; }
  .icon{ width:1em; height:1em; display:inline-block; vertical-align:-0.15em; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  a{ color:inherit; }

  /* ===== Header ===== */
  header{
    position:relative; text-align:center; padding:14px 16px 16px;
    background:linear-gradient(180deg, #1c1712 0%, var(--dark) 45%, #3d352c 100%);
    color:var(--gold-pale);
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; max-width:1100px; margin:0 auto 6px; }
  .lang-switch{
    display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.06);
    border:1px solid rgba(233,215,174,.25); border-radius:999px; padding:3px; font-size:12px;
  }
  .lang-switch button{
    border:none; background:transparent; color:var(--gold-soft); padding:6px 13px;
    border-radius:999px; cursor:pointer; font-family:'Poppins'; font-size:12px; letter-spacing:.3px;
    display:flex; align-items:center; gap:5px; transition:.2s;
  }
  .lang-switch button.active{ background:var(--gold); color:#20190c; font-weight:600; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid rgba(233,215,174,.25);
    background:rgba(255,255,255,.06); color:var(--gold-soft); display:flex; align-items:center;
    justify-content:center; font-size:15px; cursor:pointer;
  }
  .logo-img{ display:block; margin:4px auto 2px; max-width:170px; width:42%; height:auto; }
  header .tagline{ margin:2px 0 0; color:var(--muted-soft); font-size:13px; letter-spacing:.4px; }
  .header-divider{ width:44px; height:2px; background:var(--gold); margin:10px auto 0; border-radius:2px; opacity:.8; }

  /* ===== Offers banner ===== */
  .offers-banner{
    position:relative; overflow:hidden;
    background:linear-gradient(90deg, var(--gold-deep), var(--gold) 45%, var(--gold-deep));
    color:#241a09;
  }
  .offers-track{ position:relative; height:46px; max-width:1100px; margin:0 auto; }
  .offer-slide{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:13.5px; font-weight:500; letter-spacing:.2px; padding:0 46px;
    opacity:0; transform:translateY(10px); transition:opacity .55s ease, transform .55s ease; text-align:center;
  }
  .offer-slide.active{ opacity:1; transform:translateY(0); }
  .offer-slide .icon{ width:16px; height:16px; flex:none; }
  .offers-dots{ position:absolute; inset-inline-end:14px; top:50%; transform:translateY(-50%); display:flex; gap:5px; }
  .offers-dots button{
    width:6px; height:6px; border-radius:50%; border:none; background:rgba(36,26,9,.3); padding:0; cursor:pointer;
  }
  .offers-dots button.active{ background:#241a09; width:16px; border-radius:4px; }

  /* ===== Trust bar ===== */
  .trust-bar{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
    max-width:1100px; margin:18px auto 0; padding:0 16px;
  }
  .trust-item{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:9px 16px; font-size:12px; color:var(--ink); box-shadow:var(--shadow);
  }
  .trust-item .icon{ color:var(--gold-deep); width:16px; height:16px; flex:none; }

  /* ===== Not-found banner ===== */
  .notfound-banner{
    max-width:900px; margin:16px auto 0; background:var(--surface); border:1px dashed var(--gold);
    border-radius:14px; padding:11px 18px; font-size:12.5px; color:var(--ink); text-align:center;
  }
  .notfound-banner a{ color:var(--wa-deep); font-weight:700; text-decoration:none; }

  /* ===== Search / filters ===== */
  .search-controls{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    max-width:900px; margin:16px auto 0; padding:0 16px;
  }
  .search-field{ position:relative; flex:1; min-width:200px; }
  .search-field .icon{ position:absolute; inset-inline-start:14px; top:50%; transform:translateY(-50%); color:var(--muted); width:16px; height:16px; }
  .search-input{
    width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-radius:999px; padding:11px 16px 11px 40px; font-size:13.5px; font-family:'Poppins';
  }
  html[dir="rtl"] .search-input{ padding:11px 40px 11px 16px; }
  .brand-select{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-radius:999px; padding:11px 18px; font-size:13px; font-family:'Poppins'; min-width:150px;
  }
  .search-input:focus, .brand-select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-pale); }

  .results-count{ max-width:900px; margin:14px auto 0; text-align:center; color:var(--muted); font-size:12.5px; }

  .filters{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    padding:16px; max-width:960px; margin:0 auto;
  }
  .filter-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface); color:var(--ink);
    border:1px solid var(--line); padding:9px 16px; border-radius:999px; font-size:12.5px; cursor:pointer;
    font-family:'Poppins'; transition:.15s;
  }
  .filter-btn .icon{ width:14px; height:14px; color:var(--gold-deep); }
  .filter-btn:hover{ border-color:var(--gold); }
  .filter-btn.active{ background:var(--dark); color:var(--gold-soft); border-color:var(--dark); }
  .filter-btn.active .icon{ color:var(--gold-soft); }

  .show-more-wrap{ display:flex; justify-content:center; margin:20px 0 6px; }
  .show-more-btn{
    background:var(--surface); color:var(--gold-deep); border:1px solid var(--gold);
    padding:11px 26px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; font-family:'Poppins';
    display:flex; align-items:center; gap:8px;
  }
  .show-more-btn:hover{ background:var(--gold); color:#fff; }

  /* ===== Grid / cards ===== */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:22px; padding:10px 16px 52px; max-width:1180px; margin:0 auto;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow);
    transition:transform .25s ease, box-shadow .25s ease; position:relative;
  }
  .card:hover{ transform:translateY(-5px); box-shadow:var(--shadow-lg); }
  .card .imgwrap{
    width:100%; aspect-ratio:1/1; background:var(--bg-soft);
    display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
  }
  .card .imgwrap img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease; }
  .card:hover .imgwrap img{ transform:scale(1.06); }
  .card .imgwrap .placeholder{ color:var(--muted); font-size:12px; text-align:center; padding:8px; }
  /* شارتي الخصم والجنس مقصودتين تكونان داخل بطاقة المعلومات (تحت الصورة) لا فوق
     الصورة — عشان ما تغطيان أي جزء من تصميم صورة العطر (ألوان/عناوين Canva تختلف
     من صورة لصورة). */
  .old-price{
    color:var(--muted-soft); font-weight:400; font-size:10.5px; text-decoration:line-through;
    margin-inline-end:4px; display:inline-block;
  }

  .card .info{ padding:16px 16px 4px; flex:1; display:flex; flex-direction:column; gap:7px; }
  .impressions-tag{ font-size:9px; letter-spacing:2.5px; text-transform:uppercase; color:var(--muted-soft); font-weight:600; }
  .name-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card .brand{ font-size:11px; color:var(--gold-deep); letter-spacing:.5px; font-weight:600; }
  .discount-tag{
    flex:none; background:#a23b3b; color:#fff; border-radius:999px; padding:3px 8px 3px 7px;
    font-size:10px; font-weight:700; display:flex; align-items:center; gap:3px; line-height:1;
  }
  .discount-tag .icon{ width:10px; height:10px; }
  .card .name{ font-family:'Cormorant Garamond', serif; font-size:21px; font-weight:600; color:var(--ink); line-height:1.2; }
  .badge-row{ display:flex; gap:6px; flex-wrap:wrap; margin:1px 0; }
  .badge{
    display:flex; align-items:center; gap:5px; font-size:10.5px; background:var(--bg-soft); color:var(--muted);
    padding:4px 10px; border-radius:999px; border:1px solid var(--line);
  }
  .badge.badge-gender{ background:var(--ink); color:var(--gold-soft); border-color:var(--ink); }
  .badge.badge-gender .icon{ color:var(--gold-soft); }
  .badge .icon{ width:11px; height:11px; color:var(--gold-deep); }

  .notes-toggle{
    display:flex; align-items:center; gap:5px; font-size:12px; color:var(--gold-deep); background:none; border:none;
    cursor:pointer; text-align:start; padding:2px 0; margin-top:2px; font-family:'Poppins'; font-weight:500;
  }
  .notes-toggle .chev{ width:12px; height:12px; transition:transform .2s; }
  .notes-toggle.open .chev{ transform:rotate(180deg); }
  .notes-box{
    display:none; font-size:12px; color:var(--muted); line-height:1.8;
    background:var(--bg-soft); border-radius:10px; padding:10px 12px; margin-top:2px;
  }
  .notes-box.open{ display:block; }
  .notes-box .row{ display:flex; gap:6px; align-items:flex-start; margin-bottom:4px; }
  .notes-box .row .icon{ width:13px; height:13px; margin-top:2px; color:var(--gold-deep); flex:none; }
  .notes-box b{ color:var(--ink); font-weight:600; }

  .size-row{ display:flex; gap:8px; margin-top:10px; }
  .size-pill{
    flex:1; text-align:center; border:1px solid var(--line); background:var(--bg-soft); color:var(--ink);
    border-radius:12px; padding:8px 6px; font-size:11.5px; cursor:pointer; font-family:'Poppins'; line-height:1.5;
  }
  .size-pill b{ display:block; font-size:13px; }
  .size-pill.active{ border-color:var(--gold); background:var(--gold-pale); }
  .size-pill.disabled{ opacity:.45; cursor:not-allowed; text-decoration:line-through; }

  .card-bottom{ padding:12px 16px 16px; }
  .add-btn{
    width:100%; margin-top:4px; padding:12px; border:none; border-radius:12px;
    background:var(--dark); color:var(--gold-soft); font-weight:600; font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; font-family:'Poppins'; transition:.2s;
  }
  .add-btn .icon{ width:15px; height:15px; }
  .add-btn:hover{ background:var(--gold-deep); color:#fff; }
  .add-btn.added{ background:var(--wa); color:#fff; }
  .add-btn:disabled{ background:var(--bg-soft); color:var(--muted); cursor:not-allowed; }

  .card .brand{ cursor:pointer; }
  .card .brand:hover{ text-decoration:underline; }

  /* ===== Qty stepper (on cards + inside cart modal) ===== */
  .qty-stepper{
    width:100%; margin-top:4px; display:flex; align-items:center; justify-content:space-between;
    background:var(--wa); color:#fff; border-radius:12px; padding:4px; gap:6px;
  }
  .qty-stepper button{
    width:36px; height:36px; flex:none; border:none; border-radius:9px; background:rgba(255,255,255,.18);
    color:#fff; font-size:17px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-family:'Poppins';
  }
  .qty-stepper button:hover{ background:rgba(255,255,255,.3); }
  .qty-stepper .qty-mid{ display:flex; align-items:center; gap:6px; font-weight:600; font-size:13px; }
  .qty-stepper .qty-mid .icon{ width:15px; height:15px; }

  /* ===== Cart modal ===== */
  .view-cart-btn{
    background:none; border:1px solid rgba(233,215,174,.3); color:var(--gold-soft); border-radius:999px;
    padding:5px 9px; font-size:11px; cursor:pointer; display:flex; align-items:center; gap:5px; font-family:'Poppins';
    flex:none;
  }
  .view-cart-btn .icon{ width:12px; height:12px; }
  .cart-modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,16,11,.55); z-index:80;
    align-items:flex-end; justify-content:center;
  }
  .cart-modal-overlay.open{ display:flex; }
  .cart-modal{
    background:var(--surface); width:100%; max-width:560px; max-height:78vh; border-radius:20px 20px 0 0;
    display:flex; flex-direction:column; box-shadow:var(--shadow-lg);
  }
  .cart-modal-head{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line);
  }
  .cart-modal-head h3{ margin:0; font-family:'Cormorant Garamond'; font-size:19px; }
  .cart-modal-close{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); line-height:1; padding:4px; }
  .cart-modal-body{ overflow-y:auto; padding:8px 18px; flex:1; }
  .cart-modal-item{
    display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .cart-modal-item img{ width:52px; height:52px; object-fit:cover; border-radius:10px; flex:none; background:var(--bg-soft); }
  .cart-modal-item .ci-info{ flex:1; min-width:0; }
  .cart-modal-item .ci-brand{ font-size:10.5px; color:var(--gold-deep); font-weight:600; }
  .cart-modal-item .ci-name{ font-size:14px; font-weight:600; color:var(--ink); }
  .cart-modal-item .ci-meta{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .cart-modal-item .ci-actions{ display:flex; align-items:center; gap:8px; flex:none; }
  .cart-modal-item .qty-stepper{ width:auto; background:var(--bg-soft); color:var(--ink); }
  .cart-modal-item .qty-stepper button{ background:var(--surface); color:var(--ink); width:26px; height:26px; font-size:14px; box-shadow:0 1px 2px rgba(0,0,0,.1); }
  .cart-modal-item .remove-btn{
    background:none; border:none; color:#a23b3b; cursor:pointer; padding:4px; display:flex; align-items:center;
  }
  .cart-modal-item .remove-btn .icon{ width:16px; height:16px; }
  .cart-modal-empty{ text-align:center; color:var(--muted); padding:40px 10px; }
  .cart-modal-total{ padding:14px 18px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:600; }

  footer{ text-align:center; color:var(--muted-soft); font-size:12px; padding:34px 20px 24px; background:var(--dark); }
  footer .foot-logo{ color:var(--gold-soft); font-family:'Cormorant Garamond'; font-size:20px; letter-spacing:1px; margin-bottom:6px; }
  footer .foot-line{ width:34px; height:1px; background:var(--gold); opacity:.5; margin:10px auto; }
  .empty{ text-align:center; color:var(--muted); padding:50px; grid-column:1/-1; }

  /* ===== Floating cart bar ===== */
  .cart-bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--dark);
    padding:10px 18px 13px; display:flex; flex-direction:column; gap:8px;
    z-index:50; box-shadow:0 -8px 24px rgba(0,0,0,.25);
  }
  .cart-bottom-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .payment-row{ display:none; gap:6px; flex-wrap:wrap; justify-content:center; padding-bottom:2px; }
  .payment-pill{
    background:rgba(255,255,255,.07); border:1px solid rgba(233,215,174,.25); color:var(--gold-soft);
    border-radius:999px; padding:6px 13px; font-size:11px; display:flex; align-items:center; gap:5px;
    cursor:pointer; font-family:'Poppins';
  }
  .payment-pill .icon{ width:12px; height:12px; }
  .payment-pill.active{ background:var(--gold); color:#20190c; border-color:var(--gold); font-weight:600; }
  .cart-bar .cart-info{
    font-size:12.5px; color:var(--gold-soft); display:flex; align-items:center; gap:8px;
    background:none; border:none; padding:6px 4px; font-family:'Poppins'; text-align:start; cursor:pointer;
  }
  .cart-bar .cart-info .icon{ width:17px; height:17px; }
  .cart-bar .cart-info b{ color:#fff; }
  .checkout-btn{
    background:var(--wa); color:#fff; border:none; padding:12px 22px;
    border-radius:12px; font-weight:600; font-size:13.5px; cursor:pointer;
    text-decoration:none; white-space:nowrap; display:flex; align-items:center; gap:8px; font-family:'Poppins';
  }
  .checkout-btn .icon{ width:15px; height:15px; }
  .checkout-btn:disabled{ opacity:.35; cursor:not-allowed; }

  @media (max-width:520px){
    .logo-img{ width:52%; }
    .offer-slide{ font-size:12px; padding:0 40px; }
  }
</style>

// يرجع سعر الحجم المطلوب حسب الدولة المختارة حاليًا (null لو ما فيه سعر لهذي الدولة بعد)
function priceFor(p, size){
  if(country === "OM") return size==="50" ? p.price50Om : p.price10Om;
  return size==="50" ? p.price50 : p.price10;
}
// السعر قبل الخصم (لو موجود ومكتوب بالشيت) — يُعرض مشطوب فوق السعر الحالي
function priceBeforeFor(p, size){
  if(country === "OM") return size==="50" ? p.price50OmBefore : p.price10OmBefore;
  return size==="50" ? p.price50Before : p.price10Before;
}
// نسبة الخصم % لأعلى خصم متاح على أي حجم — تُستخدم لشارة الخصم على الصورة
function bestDiscountPct(p){
  let best = 0;
  ["50","10"].forEach(sz=>{
    const now = priceFor(p, sz), before = priceBeforeFor(p, sz);
    if(now && before && before > now){
      const pct = Math.round((1 - now/before) * 100);
      if(pct > best) best = pct;
    }
  });
  return best;
}
function currencyLabel(){
  return lang==="ar" ? COUNTRIES[country].currencyAr : COUNTRIES[country].currencyEn;
}

function toTitleCase(str){
  if(!str) return "";
  return str.toLowerCase().split(" ").map(w => w.length ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(" ");
}

// نبني قائمة مفاتيح الترجمة مرتّبة من الأطول للأقصر (عدد كلمات ثم عدد أحرف)
// عشان العبارات المركّبة تترجم أولاً قبل الكلمات المفردة اللي بداخلها
const TERM_KEYS_SORTED = Object.keys(TERM_AR).sort((a,b)=>{
  const wa = a.split(/\s+/).length, wb = b.split(/\s+/).length;
  if(wb !== wa) return wb - wa;
  return b.length - a.length;
});

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// \b الإنجليزية ما تشتغل صح إذا أول/آخر حرف بالعبارة رمز غير حرفي مثل ) أو ( أو / أو ~
// عشان كذا نبني حدود يدوية: نستخدم \b بس لو الطرف حرف/رقم فعلاً
function boundedPattern(key){
  const escaped = escapeRegExp(key);
  const startsWord = /^[a-zA-Z0-9]/.test(key);
  const endsWord = /[a-zA-Z0-9]$/.test(key);
  return (startsWord ? "\\b" : "") + escaped + (endsWord ? "\\b" : "");
}

// يطبّق قاموس الترجمة على أي نص حر (مكونات، ثبات، انتشار، مواسم...)
// يترجم العبارات والكلمات المعروفة، ويترك أي كلمة غير معروفة (أسماء علم، أرقام) كما هي
function applyTermDict(text){
  let result = text;
  for(const key of TERM_KEYS_SORTED){
    const re = new RegExp(boundedPattern(key), "gi");
    if(re.test(result)){
      result = result.replace(re, TERM_AR[key]);
    }
  }
  return result;
}

function translateForDisplay(text){
  if(lang !== "ar" || !text) return text || "";
  let result = applyTermDict(text);
  // فواصل عربية بدل الفواصل الإنجليزية، بعد الترجمة
  result = result.replace(/\s*;\s*/g, "؛ ").replace(/\s*,\s*/g, "، ");
  return result;
}

// يعرض المكونات/الأكوردات بالعربي: يفضّل النص العربي المكتوب يدويًا من الصورة (Main Accords (AR) / Notes (AR))
// لو موجود، وإلا يرجع للترجمة التلقائية بالقاموس كحل احتياطي (للعطور اللي ما تعبّت لها ترجمة يدوية بعد)
function accordsDisplayFor(p){
  if(lang === "ar") return p.accordsAR ? p.accordsAR : translateForDisplay(p.accords);
  return p.accords || "";
}
function notesDisplayFor(p){
  if(lang === "ar") return p.notesTopAR ? p.notesTopAR : translateForDisplay(p.notesTop);
  return p.notesTop || "";
}

// محول رابط Google Drive بأي صيغة إلى رابط صورة مباشر قابل للعرض
function driveDirectImageUrl(link){
  if(!link) return "";
  const m = link.match(/[-\w]{25,}/);
  return m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=w1000` : link;
}

// محلّل CSV بسيط يدعم الحقول المحاطة بعلامات اقتباس (فيها فواصل)
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && next === '\n') i++;
        row.push(field); field = "";
        if(row.some(v=>v!=="")) rows.push(row);
        row = [];
      } else { field += c; }
    }
  }
  if(field!=="" || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function seasonsFromText(text){
  const t = (text||"").toLowerCase();
  const out = [];
  if(t.includes("all")) out.push("all");
  if(t.includes("summer")) out.push("summer");
  if(t.includes("winter")) out.push("winter");
  if(t.includes("spring")) out.push("spring");
  if(t.includes("autumn") || t.includes("fall")) out.push("autumn");
  return out;
}

function daynightFromText(text){
  const t = (text||"").toLowerCase();
  const out = [];
  if(t.includes("day")) out.push("day");
  if(t.includes("night")) out.push("night");
  return out;
}

function genderKeyFromText(text){
  const t = (text||"").toLowerCase().trim();
  if(!t) return "";
  if(t.includes("unisex") || t.includes("both")) return "unisex";
  if(t.includes("women") || t.includes("woman") || t.includes("female") || t === "her") return "women";
  if(t.includes("men") || t.includes("man") || t.includes("male") || t === "him") return "men";
  return "";
}

let loadState = "loading"; // "loading" | "error" | "loaded"
let loadErrorMsg = "";

async function loadPerfumesFromSheet(){
  try{
    const res = await fetch(CSV_URL);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if(rows.length < 2) throw new Error("empty sheet");

    const headers = rows[0].map(h => h.trim());
    const idx = name => headers.indexOf(name);

    perfumes = rows.slice(1).filter(r => r[idx("Brand")] && r[idx("Name")]).map((r, i) => ({
      id: "row-" + i,
      brand: r[idx("Brand")] || "",
      name: r[idx("Name")] || "",
      image: driveDirectImageUrl(r[idx("Image Link (Google Drive)")]),
      seasons: seasonsFromText(r[idx("Seasons")]),
      daynight: daynightFromText(r[idx("Day/Night")]),
      gender: genderKeyFromText(r[idx("Gender")]),
      price50: parseFloat(r[idx("50ML Price UAE (AED)")]) || null,
      price10: parseFloat(r[idx("10ML Price UAE (AED)")]) || null,
      // عمودي سعر عُمان اختياريان — لو مو موجودين بالشيت بعد أو فاضين، يظهر "السعر عند الطلب" لما تكون عُمان مختارة
      price50Om: idx("50ML Price Oman (OMR)") === -1 ? null : (parseFloat(r[idx("50ML Price Oman (OMR)")]) || null),
      price10Om: idx("10ML Price Oman (OMR)") === -1 ? null : (parseFloat(r[idx("10ML Price Oman (OMR)")]) || null),
      // أعمدة "السعر قبل الخصم" اختيارية بالكامل — فاضية = ما فيه خصم يُعرض لهذا العطر
      price50Before: idx("50ML Price UAE (AED) - Before Discount") === -1 ? null : (parseFloat(r[idx("50ML Price UAE (AED) - Before Discount")]) || null),
      price10Before: idx("10ML Price UAE (AED) - Before Discount") === -1 ? null : (parseFloat(r[idx("10ML Price UAE (AED) - Before Discount")]) || null),
      price50OmBefore: idx("50ML Price Oman (OMR) - Before Discount") === -1 ? null : (parseFloat(r[idx("50ML Price Oman (OMR) - Before Discount")]) || null),
      price10OmBefore: idx("10ML Price Oman (OMR) - Before Discount") === -1 ? null : (parseFloat(r[idx("10ML Price Oman (OMR) - Before Discount")]) || null),
      stock50: idx("50ML In Stock") === -1 ? true : (r[idx("50ML In Stock")] || "").trim().toLowerCase() !== "no",
      stock10: idx("10ML In Stock") === -1 ? true : (r[idx("10ML In Stock")] || "").trim().toLowerCase() !== "no",
      accords: r[idx("Main Accords")] || "",
      accordsAR: idx("Main Accords (AR)") === -1 ? "" : (r[idx("Main Accords (AR)")] || ""),
      notesTop: r[idx("Notes")] || "",
      notesTopAR: idx("Notes (AR)") === -1 ? "" : (r[idx("Notes (AR)")] || ""),
      notesMid: "", notesBase: "",
      longevity: r[idx("Longevity")] || "", sillage: r[idx("Sillage")] || ""
    }));

    perfumes.sort((a, b) => {
      const brandCompare = a.brand.localeCompare(b.brand, "en", {sensitivity: "base"});
      if(brandCompare !== 0) return brandCompare;
      return a.name.localeCompare(b.name, "en", {sensitivity: "base"});
    });

    loadState = "loaded";
  } catch(err){
    loadState = "error";
    loadErrorMsg = err.message;
  }
  renderAll();
}

let activeFilter = "all";
let selectedBrand = "all";
let searchQuery = "";
const PAGE_SIZE = 12;
let visibleCount = PAGE_SIZE;
let cart = {}; // in-memory only, no browser storage: { perfumeId: {size, qty} } — نجيب البراند/الاسم/السعر وقت العرض من مصفوفة perfumes نفسها

/* ===== Offers banner (نصوص العروض ثابتة ومطابقة لتعليمات المتجر — تُحدَّث يدويًا هنا لو تغيّرت العروض) ===== */
let offerIndex = 0;
let offerTimer = null;

function renderOffers(){
  const t = I18N[lang];
  const track = document.getElementById("offersTrack");
  const dotsWrap = document.getElementById("offersDots");
  track.querySelectorAll(".offer-slide").forEach(n=>n.remove());

function resetOfferTimer(){
  if(offerTimer) clearInterval(offerTimer);
  offerTimer = setInterval(()=>{
    offerIndex = (offerIndex+1) % I18N[lang].offers.length;
    renderOffers();
  }, OFFER_INTERVAL_MS);
}

function renderSearchControls(){
  const t = I18N[lang];
  const searchInput = document.getElementById("searchInput");
  searchInput.placeholder = t.searchPlaceholder;
  searchInput.value = searchQuery;
  searchInput.oninput = (e)=>{ searchQuery = e.target.value; visibleCount = PAGE_SIZE; renderGrid(); };

  const brandSelect = document.getElementById("brandSelect");
  const brands = Array.from(new Set(perfumes.map(p => p.brand).filter(Boolean)))
    .sort((a, b) => a.localeCompare(b, "en", {sensitivity: "base"}));

  const prevSelection = selectedBrand;
  brandSelect.innerHTML = `<option value="all">${t.allBrands}</option>` +
    brands.map(b => `<option value="${b.replace(/"/g,"&quot;")}">${toTitleCase(b)}</option>`).join("");
  selectedBrand = brands.includes(prevSelection) ? prevSelection : "all";
  brandSelect.value = selectedBrand;
  brandSelect.onchange = (e)=>{ selectedBrand = e.target.value; visibleCount = PAGE_SIZE; renderGrid(); };

function renderFilters(){
  const t = I18N[lang];
  const wrap = document.getElementById("filters");
  wrap.innerHTML = "";
  t.filters.forEach(f=>{
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (f.key===activeFilter ? " active" : "");
    btn.innerHTML = svgIcon(ICONS[f.icon]) + `<span>${f.label}</span>`;
    btn.onclick = ()=>{ activeFilter = f.key; visibleCount = PAGE_SIZE; renderFilters(); renderGrid(); };
    wrap.appendChild(btn);
  });
}

function matches(p){
  if(selectedBrand !== "all" && p.brand !== selectedBrand) return false;
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    if(!(p.brand.toLowerCase().includes(q) || p.name.toLowerCase().includes(q))) return false;
  }
  if(activeFilter==="all") return true;
  if(activeFilter==="night" || activeFilter==="day") return p.daynight.includes(activeFilter);
  if(activeFilter==="men" || activeFilter==="women" || activeFilter==="unisex") return p.gender === activeFilter;
  return p.seasons.includes(activeFilter) || p.seasons.includes("all");
}

function renderGrid(){
  const t = I18N[lang];
  const grid = document.getElementById("grid");
  const resultsCountEl = document.getElementById("resultsCount");
  const showMoreWrap = document.getElementById("showMoreWrap");
  grid.innerHTML = "";
  resultsCountEl.textContent = "";
  showMoreWrap.innerHTML = "";

  if(loadState === "loading"){
    grid.innerHTML = `<div class="empty">${t.loading}</div>`;
    return;
  }
  if(loadState === "error"){
    grid.innerHTML = `<div class="empty">${t.errorPrefix} (${loadErrorMsg}).<br>${t.errorHint}</div>`;
    return;
  }

  const fullList = perfumes.filter(matches);
  if(fullList.length===0){
    grid.innerHTML = `<div class="empty">${t.noMatch}</div>`;
    return;
  }

  const list = fullList.slice(0, visibleCount);
  resultsCountEl.textContent = t.resultsCount(list.length, fullList.length);

  if(fullList.length > visibleCount){
    const moreBtn = document.createElement("button");
    moreBtn.className = "show-more-btn";
    moreBtn.type = "button";
    moreBtn.innerHTML = `<span>${t.showMore}</span>` + svgIcon("ic-chevron");
    moreBtn.onclick = ()=>{ visibleCount += PAGE_SIZE; renderGrid(); };
    showMoreWrap.appendChild(moreBtn);
  }

  list.forEach(p=>{
    const card = document.createElement("div");
    card.className = "card";
    const genderLabel = p.gender === "men" ? t.genderMen : p.gender === "women" ? t.genderWomen : p.gender === "unisex" ? t.genderUnisex : "";

    const imgWrap = document.createElement("div");
    imgWrap.className = "imgwrap";
    if(p.image){
      // لو الصورة فشلت بالتحميل (رابط معطّل/بطيء)، ما نسيب أيقونة الصورة المكسورة ونص alt يطلعون
      // فوق بعض مع شارات الجنس/الخصم — نستبدلها بنفس بلوك "الصورة قيد الإضافة" تلقائيًا.
      imgWrap.innerHTML = `<img src="${p.image}" alt="${p.brand} ${p.name}" loading="lazy" onerror="const w=this.parentElement; this.remove(); w.insertAdjacentHTML('afterbegin','&lt;div class=&quot;placeholder&quot;&gt;${t.imgPending}&lt;/div&gt;');">`;
    } else {
      imgWrap.innerHTML = `<div class="placeholder">${t.imgPending}</div>`;
    }
    // ملاحظة مهمة: ولا شارة (خصم/جنس) تنحط فوق الصورة (overlay) عشان صور العطور
    // نفسها تصاميم كانفا فيها ألوان وأحيانًا نصوص/عناوين مدمجة بالصورة نفسها —
    // أي شارة فوقها ممكن تغطي جزء منها بشكل غير متوقع حسب كل صورة. فبدالها نعرض
    // كل الشارات داخل بطاقة المعلومات تحت الصورة (منطقة بيضاء ثابتة) عشان تكون
    // واضحة دايمًا ومضمونة إنها ما تغطي شي أبدًا، بغض النظر عن تصميم أي صورة.
    const discountPct = bestDiscountPct(p);

    const info = document.createElement("div");
    info.className = "info";

    const accordsDisplay = accordsDisplayFor(p);
    const notesTopDisplay = notesDisplayFor(p);
    const longevityDisplay = translateForDisplay(p.longevity);
    const sillageDisplay = translateForDisplay(p.sillage);
    const hasDetails = accordsDisplay || notesTopDisplay || longevityDisplay || sillageDisplay;

    info.innerHTML = `
      <div class="impressions-tag">Impressions</div>
      <div class="name-row">
        <div class="brand" title="${lang==="ar" ? "عرض كل عطور هذا البراند" : "Show all perfumes from this brand"}">${toTitleCase(p.brand)}</div>
        ${discountPct > 0 ? `<div class="discount-tag">${svgIcon("ic-sparkle")}<span>${lang==="ar" ? `خصم ${discountPct}٪` : `-${discountPct}%`}</span></div>` : ""}
      </div>
      <div class="name">${toTitleCase(p.name)}</div>
      ${genderLabel ? `<div class="badge-row"><span class="badge badge-gender">${svgIcon(ICONS[p.gender])}${genderLabel}</span></div>` : ""}
      <button class="notes-toggle" type="button"><span>${t.notesToggleOpen}</span>${svgIcon("ic-chevron","chev")}</button>
      <div class="notes-box">
        ${accordsDisplay ? `<div class="row">${svgIcon("ic-sparkle")}<div><b>${t.accordsLabel}:</b> ${accordsDisplay}</div></div>` : ""}
        ${notesTopDisplay ? `<div class="row">${svgIcon("ic-sparkle")}<div><b>${t.top}:</b> ${notesTopDisplay}</div></div>` : ""}
        ${longevityDisplay ? `<div class="row">${svgIcon("ic-clock")}<div><b>${t.longevity}:</b> ${longevityDisplay}</div></div>` : ""}
        ${sillageDisplay ? `<div class="row">${svgIcon("ic-wind")}<div><b>${t.sillage}:</b> ${sillageDisplay}</div></div>` : ""}
      </div>
    `;

    const brandEl = info.querySelector(".brand");
    brandEl.onclick = ()=>{
      selectedBrand = p.brand;
      const brandSelect = document.getElementById("brandSelect");
      if(brandSelect) brandSelect.value = p.brand;
      visibleCount = PAGE_SIZE;
      renderGrid();
      window.scrollTo({top:0, behavior:"smooth"});
    };

    const notesToggle = info.querySelector(".notes-toggle");
    const notesBox = info.querySelector(".notes-box");
    if(!hasDetails) notesToggle.style.display = "none";
    notesToggle.onclick = ()=>{
      notesBox.classList.toggle("open");
      notesToggle.classList.toggle("open");
      notesToggle.querySelector("span").textContent = notesBox.classList.contains("open") ? t.notesToggleClose : t.notesToggleOpen;
    };

    const bottom = document.createElement("div");
    bottom.className = "card-bottom";
    // وجود الحجم أصلاً يُحدَّد من سعر الإمارات (المرجع الأساسي) — سعر عُمان قد يكون فاضي مؤقتًا وهذا لا يخفي الحجم، بس يعرض "اسأل عن السعر"
    let selectedSize = (p.price50 && p.stock50) ? "50" : ((p.price10 && p.stock10) ? "10" : null);

    function sizeRowHtml(){
      const parts = [];
      [["50", p.price50, p.stock50], ["10", p.price10, p.stock10]].forEach(([sz, existsPrice, inStock])=>{
        if(!existsPrice) return;
        const shownPrice = priceFor(p, sz);
        const beforePrice = priceBeforeFor(p, sz);
        const hasDiscount = shownPrice != null && beforePrice != null && beforePrice > shownPrice;
        const oldPriceHtml = hasDiscount ? `<s class="old-price">${beforePrice} ${currencyLabel()}</s>` : "";
        const priceHtml = shownPrice != null ? `${oldPriceHtml}${shownPrice} ${currencyLabel()}` : t.askPrice;
        parts.push(`<div class="size-pill ${selectedSize===sz?"active":""} ${!inStock?"disabled":""}" data-size="${sz}">${sz}ml<b>${priceHtml}</b>${!inStock?`<div style="font-size:9px;color:var(--muted);">${t.outOfStock}</div>`:""}</div>`);
      });
      return parts.length ? `<div class="size-row">${parts.join("")}</div>` : `<div style="font-size:12px;color:var(--muted);margin-top:8px;">${t.askPrice}</div>`;
    }

    const actionArea = document.createElement("div");
    actionArea.className = "action-area";

    function renderActionArea(){
      const entry = cart[p.id];
      if(entry){
        // العطر بالسلة أصلًا — نعرض عدّاد الكمية (+/-) بدل زر الإضافة
        actionArea.innerHTML = `
          <div class="qty-stepper">
            <button type="button" class="qty-minus" aria-label="-">−</button>
            <div class="qty-mid">${svgIcon("ic-check")}<span>${entry.qty} ${t.inCartLabel}</span></div>
            <button type="button" class="qty-plus" aria-label="+">+</button>
          </div>`;
        actionArea.querySelector(".qty-minus").onclick = ()=>{
          if(entry.qty > 1){ entry.qty -= 1; }
          else { delete cart[p.id]; }
          renderActionArea();
          renderCart();
        };
        actionArea.querySelector(".qty-plus").onclick = ()=>{
          entry.qty += 1;
          renderActionArea();
          renderCart();
        };
      } else {
        const addBtn = document.createElement("button");
        addBtn.className = "add-btn";
        if(!selectedSize){
          addBtn.innerHTML = `<span>${t.allOutOfStock}</span>`;
          addBtn.disabled = true;
        } else {
          addBtn.disabled = false;
          addBtn.innerHTML = svgIcon("ic-plus") + `<span>${t.add}</span>`;
        }
        addBtn.onclick = ()=>{
          if(!selectedSize) return;
          cart[p.id] = { size: selectedSize, qty: 1 };
          renderActionArea();
          renderCart();
        };
        actionArea.innerHTML = "";
        actionArea.appendChild(addBtn);
      }
    }

    bottom.innerHTML = sizeRowHtml();
    bottom.appendChild(actionArea);
    renderActionArea();

    bottom.querySelectorAll(".size-pill").forEach(pill=>{
      pill.onclick = ()=>{
        if(pill.classList.contains("disabled")) return;
        selectedSize = pill.dataset.size;
        bottom.querySelectorAll(".size-pill").forEach(x=>x.classList.remove("active"));
        pill.classList.add("active");
        // لو العطر أصلًا بالسلة، تغيير المقاس ينقل نفس الكمية للمقاس الجديد
        if(cart[p.id]) cart[p.id].size = selectedSize;
        renderCart();
      };
    });

    card.appendChild(imgWrap);
    card.appendChild(info);
    card.appendChild(bottom);
    grid.appendChild(card);
  });
}

function paymentLabel(t, method){
  return method==="tabby" ? t.paymentTabby : method==="bank" ? t.paymentBank : t.paymentCOD;
}

function renderPaymentRow(hasItems){
  const t = I18N[lang];
  const wrap = document.getElementById("paymentRow");
  if(!hasItems){ wrap.style.display = "none"; wrap.innerHTML = ""; return; }
  wrap.style.display = "flex";
  const methods = [["cod", "ic-truck"], ["tabby", "ic-sparkle"], ["bank", "ic-shield"]]
    .filter(([key])=> key!=="tabby" || COUNTRIES[country].tabby);
  wrap.innerHTML = methods.map(([key, icon])=>
    `<button type="button" class="payment-pill ${paymentMethod===key?"active":""}" data-method="${key}">${svgIcon(icon)}<span>${paymentLabel(t,key)}</span></button>`
  ).join("");
  wrap.querySelectorAll(".payment-pill").forEach(btn=>{
    btn.onclick = ()=>{ paymentMethod = btn.dataset.method; renderCart(); };
  });
}

function cartItemsList(){
  const cur = currencyLabel();
  return Object.keys(cart).map(id => {
    const p = perfumes.find(x => x.id === id);
    if(!p) return null;
    const size = cart[id].size, qty = cart[id].qty || 1;
    const unitPrice = priceFor(p, size);
    const lineTotal = unitPrice != null ? unitPrice * qty : null;
    return { id, p, size, qty, unitPrice, lineTotal, cur };
  }).filter(Boolean);
}

function renderCart(){
  const t = I18N[lang];
  const cartInfo = document.getElementById("cartInfo");
  const checkoutBtn = document.getElementById("checkoutBtn");
  const items = cartItemsList();
  const cur = currencyLabel();

  renderPaymentRow(items.length > 0);

  if(items.length === 0){
    cartInfo.innerHTML = svgIcon("ic-cart") + `<span>${t.cartEmpty}</span>`;
    checkoutBtn.style.opacity = ".35"; checkoutBtn.style.pointerEvents = "none";
    renderCartModal();
    return;
  }

  const totalQty = items.reduce((sum,i)=> sum + i.qty, 0);
  const total = items.reduce((sum,i)=> sum + (i.lineTotal||0), 0);
  cartInfo.innerHTML = svgIcon("ic-cart") + `<span><b>${totalQty}</b> ${t.cartItemsLabel} · ${t.approxTotal} <b>${total} ${cur}</b> ${t.withoutDelivery}</span>`;
  checkoutBtn.style.opacity = "1"; checkoutBtn.style.pointerEvents = "auto";
  let msg = t.orderMsgIntro;
  items.forEach((i,idx)=>{
    const priceTxt = i.lineTotal != null ? `${i.lineTotal} ${cur}` : t.orderMsgAskPrice;
    msg += `${idx+1}. ${toTitleCase(i.p.brand)} - ${toTitleCase(i.p.name)} (${i.size}ml) x${i.qty} — ${priceTxt}\n`;
  });
  msg += `\n${t.orderMsgTotal}: ${total} ${cur} ${t.withoutDelivery}`;
  msg += `\n${t.orderMsgPayment}: ${paymentLabel(t, paymentMethod)}`;
  checkoutBtn.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  checkoutBtn.target = "_blank";

  renderCartModal();
}

/* ===== Cart modal (view / edit items) ===== */
function renderCartModal(){
  const t = I18N[lang];
  const body = document.getElementById("cartModalBody");
  const totalWrap = document.getElementById("cartModalTotal");
  document.getElementById("cartModalTitle").textContent = t.cartModalTitle;
  const items = cartItemsList();
  const cur = currencyLabel();

  if(items.length === 0){
    body.innerHTML = `<div class="cart-modal-empty">${t.cartModalEmpty}</div>`;
    totalWrap.style.display = "none";
    return;
  }

  body.innerHTML = items.map(i => `
    <div class="cart-modal-item" data-id="${i.id}">
      ${i.p.image ? `<img src="${i.p.image}" alt="">` : `<div style="width:52px;height:52px;border-radius:10px;background:var(--bg-soft);flex:none;"></div>`}
      <div class="ci-info">
        <div class="ci-brand">${toTitleCase(i.p.brand)}</div>
        <div class="ci-name">${toTitleCase(i.p.name)}</div>
        <div class="ci-meta">${i.size}ml · ${i.unitPrice != null ? `${i.unitPrice} ${cur}` : t.askPrice}${i.lineTotal != null ? ` = <b>${i.lineTotal} ${cur}</b>` : ""}</div>
      </div>
      <div class="ci-actions">
        <div class="qty-stepper">
          <button type="button" class="qty-minus" aria-label="-">−</button>
          <div class="qty-mid">${i.qty}</div>
          <button type="button" class="qty-plus" aria-label="+">+</button>
        </div>
        <button type="button" class="remove-btn" aria-label="${t.removeItem}">${svgIcon("ic-trash")}</button>
      </div>
    </div>
  `).join("");

  body.querySelectorAll(".cart-modal-item").forEach(row=>{
    const id = row.dataset.id;
    row.querySelector(".qty-minus").onclick = ()=>{
      if(!cart[id]) return;
      if(cart[id].qty > 1) cart[id].qty -= 1; else delete cart[id];
      renderCart(); renderGrid();
    };
    row.querySelector(".qty-plus").onclick = ()=>{
      if(!cart[id]) return;
      cart[id].qty += 1;
      renderCart(); renderGrid();
    };
    row.querySelector(".remove-btn").onclick = ()=>{
      delete cart[id];
      renderCart(); renderGrid();
    };
  });

  const total = items.reduce((sum,i)=> sum + (i.lineTotal||0), 0);
  totalWrap.style.display = "flex";
  totalWrap.innerHTML = `<span>${t.cartModalTotalLabel}</span><span>${total} ${cur}</span>`;
}

function openCartModal(){ document.getElementById("cartModalOverlay").classList.add("open"); renderCartModal(); }
function closeCartModal(){ document.getElementById("cartModalOverlay").classList.remove("open"); }

document.getElementById("cartInfo").onclick = openCartModal;
document.getElementById("cartModalClose").onclick = closeCartModal;
document.getElementById("cartModalOverlay").onclick = (e)=>{
  if(e.target.id === "cartModalOverlay") closeCartModal();
};

document.getElementById("btnAr").onclick = ()=> setLang("ar");
document.getElementById("btnEn").onclick = ()=> setLang("en");
document.querySelector(".offers-banner").addEventListener("mouseenter", ()=> clearInterval(offerTimer));
document.querySelector(".offers-banner").addEventListener("mouseleave", resetOfferTimer);

setLang("ar");
resetOfferTimer();
loadPerfumesFromSheet();

</script>
